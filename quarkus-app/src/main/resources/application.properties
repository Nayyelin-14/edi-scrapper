# Configuration Quarkus pour developpement

# Application
quarkus.application.name=edi-spec-scrapper
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Server
quarkus.http.port=9010
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000

# Request limits
quarkus.http.limits.max-body-size=100M

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.datasabai.services.scrapper".level=DEBUG

# Health checks
quarkus.smallrye-health.root-path=/health

# Dev mode
%dev.quarkus.log.category."com.datasabai.services.scrapper".level=DEBUG
%dev.quarkus.http.port=9010
